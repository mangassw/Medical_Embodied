ekf_filter_node:
  ros__parameters:
    # 与仿真链路保持一致：底盘原始里程计 + IMU -> EKF -> /odom + odom->base_footprint
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 订阅底盘原始里程计
    odom0: odom/unfiltered
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # 订阅 IMU，仅使用角速度 z 做平面姿态约束
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
