/**:
  ros__parameters:
    # 底盘控制节点只订阅最终安全速度口：
    # /cmd_vel_safe 应当是经过 Nav2 平滑与 collision_monitor 约束后的唯一执行速度。
    cmd_vel_topic: /cmd_vel_safe
    real_cmd_topic: /realcmd_ctrl
    can_feedback_topic: /can_msg_fb
    joy_topic_default: /joy
    joy_topic_backup: /joy_node_usb/joy
    output_odom_topic: /odom/unfiltered
    wheel_radius: 0.2032
    wheel_distance: 0.477
    wheel_diameter_inch: 8.0
    joy_liner_k: 40
    joy_angular_k: 17
    command_loop_hz: 100.0
    receive_loop_hz: 500.0
    control_rate: 50.0
    speed_compensation_ratio: 0.9523809524
    reverse_drive_direction: true
    max_wheel_rpm: 150
    can1_baud_t0: 0
    can1_baud_t1: 28
    # wheel_odom_fusion_node 现在只输出纯轮式原始里程计；
    # IMU 融合与最终 odom->base_footprint TF 统一交给 EKF 负责
    reverse_heading: false
    odom_frame: odom
    base_frame: base_footprint
    publish_odom_tf: false
    # 轮速计作为平面运动学约束：
    # - 不信轮式积分位姿，pose 全部给大协方差；
    # - vx 是短时前向速度观测，给较小协方差；
    # - vy=0 是差速/非全向底盘的重要非完整约束，给较小但不为零的协方差；
    # - wz 由左右轮差分得到，可抑制 IMU yaw rate 漂移，但受轮距/打滑影响，权重略低于 vx/vy。
    wheel_odom_pose_covariance_diagonal: [1000000.0, 1000000.0, 1000000.0, 1000000.0, 1000000.0, 1000000.0]
    wheel_odom_twist_covariance_diagonal: [0.03, 0.02, 1000000.0, 1000000.0, 1000000.0, 0.08]
    # MID360 安装角补偿统一在中间节点完成：
    # 驱动保持原始 livox_frame/raw topic，节点同时旋转点云和 IMU，
    # 再输出到符合整车约定的 lidar_3d_link / imu_link。
    raw_lidar_topic: /livox/lidar
    rotated_lidar_topic: /livox/lidar_rotated
    rotated_lidar_points_topic: /livox/lidar_rotated/points
    raw_imu_topic: /livox/imu
    rotated_imu_topic: /livox/imu_rotated
    fastlio_lidar_frame_id: lidar_3d_frame_fastlio
    nav_lidar_frame_id: lidar_3d_link
    rotated_imu_frame_id: imu_link
    mount_roll_deg: 0.0
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
    # IMU 角速度单位必须为 rad/s。静止采样取平均后，把残余 bias 填到这里。
    # 例如静止时 /livox/imu_rotated.angular_velocity.z = 0.018，则设置第三项为 0.018。
    imu_angular_velocity_bias: [0.0, 0.0, -0.024]
    # 给 IMU covariance 设置下限，避免驱动发布 0 协方差时 EKF 过度相信 IMU。
    # z 轴角速度当前观察到静态偏置，默认给更保守的方差。
    imu_angular_velocity_covariance_floor: [0.02, 0.02, 0.08]
    imu_linear_acceleration_covariance_floor: [0.5, 0.5, 0.5]
