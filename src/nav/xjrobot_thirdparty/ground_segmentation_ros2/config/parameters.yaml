#Tuning Tips:
# 1) Keep groundInlierThreshold < cellSizeZPhase2
#
# 2) If small obstacles disappear → decrease groundInlierThreshold
#
# 3) If ground becomes fragmented on rough terrain → increase groundInlierThreshold slightly
#
# 4) If slopes are classified as obstacles → increase slopeThresholdDegrees
#
# 5) If ramps become ground too easily → decrease slopeThresholdDegrees
#
# 6) Large cellSizeX/Y → smoother but less detailed ground model
#    Smaller cellSizeX/Y → higher detail but more noise
#
# 7) cellSizeZPhase2 controls vertical resolution:
#    Smaller → better obstacle separation
#    Larger → smoother ground but risk of vertical merging
#
# 8) If LiDAR noise is high → consider:
#    - enabling downsample
#    - slightly increasing groundInlierThreshold
#
# 9) If vehicle operates on steep terrain → consider enabling IMU
#    use_imu_orientation: true

# Note: Config used with SemanticKITTI. Please update based on your own dataset.
ground_segmentation:
  ros__parameters:
    # pre/post processing
    robot_frame: "lidar_3d_link"       # 机器人/雷达基准坐标系（用于TF查询）
    output_frame_id: "lidar_3d_link"   # 输出点云的 frame_id
    # Nav2 only consumes /scan out to 4 m, so avoid segmenting the full MID360 cloud.
    maxX:  6.0                          # 处理区域 X 上限（米）
    minX: -6.0                          # 处理区域 X 下限（米）
    maxY:  6.0                          # 处理区域 Y 上限（米）
    minY: -6.0                          # 处理区域 Y 下限（米）
    maxZ:  1.5                          # 处理区域 Z 上限（米）
    minZ: 0.1                           # 处理区域 Z 下限（米）
    downsample: true                    # 是否先体素降采样（降噪/提速）
    downsample_resolution: 0.05          # 体素大小（米），越大越快但细节越少
    lidar_to_ground: 0.78               # 雷达到地面的高度偏置（米，按项目坐标系正负方向）
    transform_tolerance: 0.1            # TF 查询容忍延迟（秒）

    ##ground detection
    cellSizeX: 0.5                       # 地面网格 X 分辨率（米）
    cellSizeY: 0.5                       # 地面网格 Y 分辨率（米）
    cellSizeZ: 10.0                      # 第一阶段 Z 网格高度范围（米）
    cellSizeZPhase2: 0.3                 # 第二阶段 Z 分辨率（米），越小越能区分高低障碍
    slopeThresholdDegrees: 20.0          # 地面最大坡度阈值（度）
    groundInlierThreshold: 0.08          # 地面内点阈值（米），越小判定越严格
    centroidSearchRadius: 5.0            # 邻域质心搜索半径（米）
    use_imu_orientation: false           # 是否使用 IMU 姿态辅助地面估计
    maxGroundHeightDeviation: 0.05       # 邻近地面高度最大允许偏差（米）

    #debug
    show_benchmark: false                # 是否打印性能统计信息
